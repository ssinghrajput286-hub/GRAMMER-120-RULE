name: Build APK
on: workflow_dispatch
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - name: Build debug APK
        run: |
          OWNER=$(echo "$GITHUB_REPOSITORY_OWNER" | tr 'A-Z' 'a-z')
          SITE="https://$OWNER.github.io/${GITHUB_REPOSITORY#*/}/"
          mkdir www
          cp *.html *.json *.js *.png www/
          npm init -y
          npm i @capacitor/core @capacitor/cli @capacitor/android
          echo "{\"appId\":\"com.mybooks.app\",\"appName\":\"My Books\",\"webDir\":\"www\",\"server\":{\"url\":\"$SITE\"}}" > capacitor.config.json
          npx cap add android
          npx cap sync android
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug
      - uses: softprops/action-gh-release@v2
        with:
          tag_name: apk-latest
          name: Latest APK
          files: android/app/build/outputs/apk/debug/app-debug.apk
          # ok

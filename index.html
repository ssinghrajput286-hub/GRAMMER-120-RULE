<!DOCTYPE html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover"><link rel="manifest" href="manifest.json"><meta name="theme-color" content="#8b2e2e"><title>My Books</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Lora:wght@400;600&family=Playfair+Display:wght@700&display=swap">
<style>
:root{--bg:#f4eee0;--paper:#fffdf8;--ink:#2a2118;--mut:#6f604c;--gold:#c08a24;--ok:#1f7a45;--line:#e6d9bd;--sl:94%;--cl:38%;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media(prefers-color-scheme:dark){:root{--bg:#12100d;--paper:#1d1812;--ink:#f1e7d3;--mut:#b9a98f;--gold:#e0b04e;--ok:#5fd08e;--line:#3d3226;--sl:17%;--cl:70%}}
*{box-sizing:border-box;min-width:0}html,body{max-width:100%;overflow-x:hidden}body{margin:0;background:var(--bg);color:var(--ink);font:17px/1.7 'Lora',Georgia,serif}main{max-width:720px;margin:0 auto;padding:20px 14px 60px}
.hero{text-align:center;color:#fff;padding:46px 16px;border-radius:22px;background:radial-gradient(circle at 20% 10%,#c08a24 0,transparent 45%),linear-gradient(140deg,#5b1f3a,#8b2e2e 55%,#c0562b);border:3px double #ffd98a;box-shadow:0 10px 30px #0004}
.hero h1{font:700 2.2rem/1.15 'Playfair Display',Georgia,serif;margin:8px 0}.hero p{margin:0;letter-spacing:.2em;text-transform:uppercase;font-size:.78rem;opacity:.9}
.dl{display:block;width:100%;margin:22px 0 6px;padding:16px;border:0;border-radius:16px;background:var(--gold);color:#fff;font:700 1.05rem sans-serif;box-shadow:0 4px 14px #0004;cursor:pointer}
.st{text-align:center;font:600 .88rem sans-serif;color:var(--mut);margin:6px 0 22px}.st.ok{color:var(--ok)}
.card{display:flex;align-items:center;gap:14px;text-decoration:none;color:var(--ink);background:var(--paper);border-radius:18px;padding:16px;margin:14px 0;box-shadow:0 3px 14px #0002;border-left:8px solid hsl(var(--h) 62% var(--cl))}
.em{flex:none;display:grid;place-items:center;width:64px;height:64px;border-radius:18px;font-size:2rem;background:hsl(var(--h) 60% var(--sl))}.card b{display:block;font:700 1.15rem 'Playfair Display',serif}.card small{color:var(--mut)}.go{margin-left:auto;font-size:1.4rem;color:var(--gold)}
</style></head><body><main>
<div class="hero"><p>Meri Library</p><h1>📚 My Books</h1><p>Subject chuno aur padho</p></div>
<button class="dl" id="dl">⬇ Download sab books (offline padhne ke liye)</button><div class="st" id="st"></div><div id="cards"></div></main>
<script>
const FONT='https://fonts.googleapis.com/css2?family=Lora:wght@400;600&family=Playfair+Display:wght@700&display=swap';
const BASE=['index.html','books.json','manifest.json','icon-192.png','icon-512.png'];
const st=document.getElementById('st'),dl=document.getElementById('dl');let books=[];
try{if('serviceWorker' in navigator)navigator.serviceWorker.register('sw.js').catch(()=>{})}catch(e){}
async function load(){try{books=await (await fetch('books.json',{cache:'no-cache'})).json()}catch(e){try{books=await (await caches.match('books.json')).json()}catch(x){}}
document.getElementById('cards').innerHTML=books.map(b=>`<a class="card" style="--h:${b.hue||8}" href="${b.file}"><span class="em">${b.emoji||'📘'}</span><span><b>${b.title}</b><small>${b.by||''}</small></span><span class="go">›</span></a>`).join('');check()}
async function check(){try{const f=books.map(b=>b.file);let n=0;for(const u of f)if(await caches.match(u))n++;st.className='st'+(n==f.length&&f.length?' ok':'');st.textContent=n==f.length&&f.length?'✅ Sab books offline ready hain ('+n+'/'+f.length+')':'Offline ready: '+n+' / '+f.length+' books'}catch(e){st.textContent=''}}
dl.onclick=async()=>{dl.disabled=true;try{const c=await caches.open('g-offline');const u=[...books.map(b=>b.file),...BASE];let n=0;
for(const x of u){try{const r=await fetch(x,{cache:'reload'});if(r.ok)await c.put(x,r)}catch(e){}st.textContent='⬇ '+(++n)+' / '+(u.length+1)+' save ho raha hai...'}
try{const r=await fetch(FONT);const t=await r.clone().text();await c.put(FONT,r);for(const m of new Set(t.match(/https:[^)]+\.woff2/g)||[])){try{const q=await fetch(m);if(q.ok)await c.put(m,q)}catch(e){}}}catch(e){}
st.textContent='';await check()}catch(e){st.textContent='Download nahi ho paya, net check karke dobara try karo'}dl.disabled=false};
load();
</script></body></html>
